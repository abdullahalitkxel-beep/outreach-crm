name: Build desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY: ${{ vars.STORE_PUBLISHER_DISPLAY }}
      PYTHONIOENCODING: utf-8
      CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-licenses

      # A bootloader compiled here (instead of the stock pre-built one) is far less likely to be
      # mistaken for malware by antivirus heuristics.
      - name: Install PyInstaller with a freshly compiled bootloader
        id: bootloader
        continue-on-error: true
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller pyinstaller

      - name: Fall back to the standard PyInstaller
        if: steps.bootloader.outcome == 'failure'
        run: |
          pip install pyinstaller
          echo "::warning title=Bootloader::Compiling the bootloader failed; used the standard pre-built one."

      - name: Prepare version info, licence text, Store manifest, third-party notices
        run: python packaging/prepare.py ${{ github.run_number }}

      - name: Test team mode (hub and laptop)
        run: python tests/team_test.py

      - name: Test handing prospects to supervisors (two laptops and the relay)
        run: python tests/handover_test.py

      - name: Test that nobody needs anybody else online
        run: python tests/offline_test.py

      - name: Test the supervisor's mailbox inside BSO
        run: python tests/mailbox_test.py

      - name: Test BSO Bot mode and leads by email
        run: python tests/bot_mode_test.py

      - name: Test referrals, Instantly auto-pull and web contact search
        run: python tests/lead_growth_test.py

      - name: Test campaigns, many inboxes, ramp-up, deliverability guard and domain health
        run: python tests/campaigns_test.py

      - name: Test boards, comments, away mode, reassigning and removing users
        run: python tests/teamwork_test.py

      - name: Test security (2-step sign-in, permissions, idle lock, trap contacts, erase)
        run: python tests/security_test.py

      - name: Test setting up a BSO from the console
        run: python tests/setup_test.py

      - name: Test live replies (IMAP IDLE watcher)
        run: python tests/watcher_test.py

      - name: Test that test mode is kept apart from live
        run: python tests/test_mode_test.py

      - name: Test conversation following, temperature and replying from BSO
        run: python tests/conversation_test.py

      - name: Test full visibility in the Master Console (sealed reports, incidents, archive)
        run: python tests/visibility_test.py

      - name: Test AI writing from the brief and the learning engine
        run: python tests/learning_test.py

      - name: Test the bot's autopilot (clients, domains, limits, arrival windows, stock, quality, kill switch)
        run: python tests/autopilot_test.py

      - name: Test the lead intake mailbox, template, alerts, digest and information answers
        run: python tests/intake_test.py

      - name: Test role layouts, the console's BSO Bot page, devices and the Scope room
        run: python tests/console_bot_test.py

      - name: Test automatic updates (signature check, staged roll-out, hold, minimum version)
        run: python tests/updater_test.py

      - name: Test hundreds of inboxes on the bot (1000 inboxes, parallel sending and reading)
        run: python tests/scale_test.py

      - name: Test the AI line with thinking models
        run: python tests/llm_test.py

      - name: Test team mode through the Google Drive relay
        run: python tests/relay_test.py

      - name: Test the app doesn't quit while its window is hidden or asleep
        run: python tests/watchdog_test.py

      - name: Test the 200-reply set (stops in code, no AI instructions from replies, keyword sorting floors)
        run: python tests/reply_eval_test.py

      - name: Test sending safety (no double sends after a crash, replies first, breaker, backups that restore)
        run: python tests/safety_test.py

      - name: Test stop requests are always honoured (mid-run stops, test mode, lost replies, team list, stuck runs)
        run: python tests/stop_test.py

      - name: Test from source
        run: python tests/smoke_test.py app.py

      - name: Build app (folder build)
        run: >
          pyinstaller --noconfirm --onedir --windowed --noupx --name BSO
          --icon assets/icon.ico
          --version-file build/version_info.txt
          --add-data "config.yaml;."
          --add-data ".env.example;."
          --add-data "version.txt;."
          --add-data "legal;legal"
          --add-data "assets/icon.png;assets"
          --add-data "assets/icon.ico;assets"
          --add-data "hub_address.txt;."
          --add-data "relay/Code.gs;relay"
          --hidden-import apollo
          --hidden-import legal
          --hidden-import brand
          --hidden-import hub
          --hidden-import team
          --hidden-import relay
          --hidden-import mailbox
          --hidden-import instantly
          --hidden-import discover
          --hidden-import health
          --hidden-import autopilot
          --hidden-import ops
          --hidden-import crm_roles
          --hidden-import crm_role_templates
          --hidden-import hub_bot
          --hidden-import updater
          --hidden-import guard
          --hidden-import safety
          --hidden-import xlrd
          --hidden-import pypdf
          --collect-submodules holidays
          --add-data "update_key.json;."
          --add-data "assets/bso-publisher.cer;assets"
          --hidden-import waitress
          --hidden-import secretstore
          --hidden-import bs4
          --hidden-import openpyxl
          --hidden-import pystray._win32
          --collect-submodules anthropic
          --collect-data tzdata
          app.py

      - name: Check publisher details in the program file
        shell: pwsh
        run: |
          $v = (Get-Item dist\BSO\BSO.exe).VersionInfo
          $summary = "Company: $($v.CompanyName) | Product: $($v.ProductName) | Version: $($v.FileVersion) | $($v.LegalCopyright)"
          Write-Host $summary
          Write-Host "::notice title=File properties::$summary"
          if ($v.CompanyName -notmatch 'BlacSwanken') { throw "Publisher missing from file properties" }

      - name: Sign the program with BlacSwanken's certificate
        if: env.CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cs.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $out = ""; $rc = 1
          foreach ($ts in @("http://timestamp.digicert.com", "http://timestamp.sectigo.com")) {
            $out = & $st.FullName sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD /fd SHA256 /tr $ts /td SHA256 dist\BSO\BSO.exe 2>&1
            $rc = $LASTEXITCODE
            if (-not $rc) { break }
          }
          Remove-Item $pfx
          if ($rc) { Write-Host "::error title=Program signing::$(($out | Out-String) -replace "`r?`n", ' ')"; throw "signing BSO.exe failed" }
          Write-Host "::notice title=Code signing::BSO.exe signed by BlacSwanken"

      - name: Test the built app
        run: python tests/smoke_test.py dist/BSO/BSO.exe

      - name: Build installer (BSO-Setup.exe)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $guess = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $guess)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = $guess
          } else { $iscc = $iscc.Source }
          $ver = Get-Content version.txt
          $pub = python -c "import yaml;c=yaml.safe_load(open('config.yaml',encoding='utf-8'));print((c.get('legal') or {}).get('company_name') or c.get('publisher') or 'BlacSwanken')"
          & $iscc "/DAppVersion=$ver" "/DPublisher=$pub" packaging\installer.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed" }

      - name: Sign the installer, and sign the release for automatic updates
        shell: pwsh
        run: |
          if ($env:CODESIGN_PFX_BASE64) {
            $pfx = "$env:RUNNER_TEMP\cs.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            $out = & $st.FullName sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\BSO-Setup.exe 2>&1
            $rc = $LASTEXITCODE
            Remove-Item $pfx
            if ($rc) { Write-Host "::error title=Installer signing::$(($out | Out-String) -replace "`r?`n", ' ')"; throw "signing BSO-Setup.exe failed" }
          } else { Write-Host "::warning title=Code signing::CODESIGN_PFX_BASE64 secret not set: the installer is unsigned" }
          if ($env:UPDATE_SIGNING_KEY) {
            $key = "$env:RUNNER_TEMP\upd.pem"
            Set-Content -Path $key -Value $env:UPDATE_SIGNING_KEY -NoNewline
            $first = ($env:UPDATE_SIGNING_KEY -split "`n")[0].Trim()
            $lines = ($env:UPDATE_SIGNING_KEY -split "`n").Count
            $out = openssl dgst -sha256 -sign $key -out dist\BSO-Setup.exe.sig dist\BSO-Setup.exe 2>&1
            $rc = $LASTEXITCODE
            if ($rc -and ($env:UPDATE_SIGNING_KEY -match "ENCRYPTED")) {
              # the key is protected by a password: try the update key's own password secret, then the certificate's
              foreach ($pw in @($env:UPDATE_SIGNING_KEY_PASSWORD, $env:CODESIGN_PFX_PASSWORD)) {
                if (-not $pw) { continue }
                $env:BSO_KEYPASS = $pw
                $out = openssl dgst -sha256 -sign $key -passin env:BSO_KEYPASS -out dist\BSO-Setup.exe.sig dist\BSO-Setup.exe 2>&1
                $rc = $LASTEXITCODE
                Remove-Item Env:\BSO_KEYPASS
                if (-not $rc) { Write-Host "release key unlocked with its password"; break }
              }
            }
            Remove-Item $key
            if ($rc) { Write-Host "::error title=Release signature::openssl couldn't use UPDATE_SIGNING_KEY (first line '$first', $lines line(s)): $(($out | Out-String) -replace "`r?`n", ' ')"; throw "release signature failed" }
            python -c "import updater,sys; ok=updater.verify(open('dist/BSO-Setup.exe','rb').read(), open('dist/BSO-Setup.exe.sig','rb').read()); print('release signature ok' if ok else 'BAD'); sys.exit(0 if ok else 1)"
            if ($LASTEXITCODE) { Write-Host "::error title=Release signature::UPDATE_SIGNING_KEY is a valid key but not the one in update_key.json: paste the private key from the secrets file again"; throw "the release signature doesn't match update_key.json" }
          } else { Write-Host "::warning title=Automatic updates::UPDATE_SIGNING_KEY secret not set: this release isn't signed, so BSOs won't install it automatically" }

      - name: Test the installer (install, run, check Windows "Installed apps" entry, uninstall)
        shell: pwsh
        run: |
          Start-Process dist\BSO-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\BSO\BSO.exe"
          if (-not (Test-Path $exe)) { throw "installer did not install the app" }
          $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -eq "BSO – BlacSwanken Outreach" }
          Write-Host "::notice title=Installed apps entry::$($entry.DisplayName) $($entry.DisplayVersion) by $($entry.Publisher)"
          if ($entry.Publisher -notmatch 'BlacSwanken') { throw "Publisher missing from Installed apps" }
          python tests/smoke_test.py "$exe"
          if ($LASTEXITCODE) { throw "smoke test failed on installed app" }
          # the Start-menu "BSO Master Console" shortcut must start the hub and serve the setup page
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\BSO Master Console.lnk")
          if ($lnk.Arguments -ne "--hub") { throw "Master Console shortcut missing or wrong: '$($lnk.Arguments)'" }
          $env:OUTREACH_HOME = "$env:RUNNER_TEMP\hubtest"
          $hubp = Start-Process $exe -ArgumentList "--hub --no-window" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { $r = Invoke-WebRequest http://127.0.0.1:8780/setup -UseBasicParsing -TimeoutSec 2; if ($r.Content -match "omar@blacswanken.com") { $ok = $true; break } } catch {}; Start-Sleep 1 }
          Stop-Process -Id $hubp.Id -Force -ErrorAction SilentlyContinue
          Remove-Item Env:OUTREACH_HOME
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\hubtest\hub.log" -ErrorAction SilentlyContinue; throw "installed BSO.exe --hub did not serve the setup page" }
          Write-Host "::notice title=Master console::installed BSO.exe --hub serves the setup page"
          Start-Process "$env:LOCALAPPDATA\Programs\BSO\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait
          if (Test-Path $exe) { throw "uninstall left the app behind" }

      - name: Test upgrading from the old "Outreach CRM" build (old program and shortcuts must go)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.5 --repo ${{ github.repository }} --pattern OutreachCRM-Setup.exe --dir build --clobber
          Start-Process build\OutreachCRM-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=desktopicon" -Wait
          $old = "$env:LOCALAPPDATA\Programs\Outreach CRM"
          if (-not (Test-Path "$old\OutreachCRM.exe")) { throw "old build did not install (test setup)" }
          Start-Process dist\BSO-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /TASKS=desktopicon" -Wait
          $sm = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          $left = @("$old\OutreachCRM.exe", "$sm\Outreach CRM.lnk", "$env:USERPROFILE\Desktop\Outreach CRM.lnk") | Where-Object { Test-Path $_ }
          if ($left) { throw "old files remain after upgrading: $left" }
          $dir = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | Where-Object { Test-Path "$($_.FullName)\BSO.exe" } | Select-Object -First 1)
          if (-not $dir) { throw "BSO.exe not found after upgrade" }
          if (-not (Test-Path "$sm\BSO.lnk")) { throw "BSO Start menu shortcut missing after upgrade" }
          Write-Host "::notice title=Upgrade::old build replaced by BSO in $($dir.FullName)"
          Start-Process "$($dir.FullName)\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait

      - name: Build Microsoft Store package (BSO-Store.msix)
        shell: pwsh
        run: packaging\msix.ps1 -Mode pack

      - name: Test the Store package (install test-signed copy, run, uninstall)
        shell: pwsh
        env:
          SMOKE_TMP: ${{ github.workspace }}\smoke
        run: |
          New-Item $env:SMOKE_TMP -ItemType Directory -Force | Out-Null
          packaging\msix.ps1 -Mode installtest
          python tests/smoke_test.py "$env:LOCALAPPDATA\Microsoft\WindowsApps\BSO.exe"
          $rc = $LASTEXITCODE
          packaging\msix.ps1 -Mode uninstall
          if ($rc) { throw "smoke test failed on the Store package" }

      - name: Windows App Certification Kit (Store pre-check)
        continue-on-error: true
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { Write-Host "::warning title=App Certification Kit::Not installed on this runner"; exit 0 }
          & $appcert reset | Out-Null
          & $appcert test -appxpackagepath "$pwd\build\BSO-citest.msix" -reportoutputpath "$pwd\build\wack.xml"
          python packaging/wack_summary.py build/wack.xml

      - name: Microsoft Defender scan
        continue-on-error: true
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "::warning title=Defender::Not available on this runner"; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          & $mp -Scan -ScanType 3 -File "$pwd\dist" -DisableRemediation | Tee-Object build\defender.txt
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Host "::notice title=Defender::No threats found in the app, installer or Store package" }
          elseif ($code -eq 2) { Write-Host "::error title=Defender::Threats reported: $(Get-Content build\defender.txt -Raw)"; exit 1 }
          else { Write-Host "::warning title=Defender::Scan could not run (exit $code)" }

      - uses: actions/upload-artifact@v4
        with:
          name: BSO-windows
          path: |
            dist/BSO-Setup.exe
            dist/BSO-Setup.exe.sig
            dist/BSO-Store.msix

      - name: Publish release (only after every test passed)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BSO – BlacSwanken Outreach 1.0.${{ github.run_number }} (Windows)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            ---
            **BSO-Setup.exe**: install on your PC (per-user, no admin rights needed). Shows the licence agreement and registers BlacSwanken as publisher.
            **BSO-Store.msix**: upload this to Microsoft Partner Center for the Store listing. (It isn't meant to be double-clicked; the Store signs it.)
            **privacy.html, terms.html, acceptable-use.html**: put these on blacswanken.com; the Store listing needs the privacy page's address.

            Until the Store version is live, Windows may show "Windows protected your PC" for the installer: click **More info → Run anyway**.
            Your data stays in %APPDATA%\OutreachCRM, so updating keeps everything.
          files: |
            dist/BSO-Setup.exe
            dist/BSO-Setup.exe.sig
            dist/BSO-Store.msix
            build/legal-site/privacy.html
            build/legal-site/terms.html
            build/legal-site/acceptable-use.html
