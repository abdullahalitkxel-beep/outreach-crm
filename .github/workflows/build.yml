name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test from source
        run: python tests/smoke_test.py app.py

      - name: Build OutreachCRM.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name OutreachCRM
          --icon assets/icon.ico
          --add-data "config.yaml;."
          --add-data ".env.example;."
          --hidden-import apollo
          --hidden-import bs4
          --hidden-import openpyxl
          --collect-submodules anthropic
          --collect-data tzdata
          app.py

      - name: Test the built .exe
        run: python tests/smoke_test.py dist/OutreachCRM.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OutreachCRM-windows
          path: dist/OutreachCRM.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OutreachCRM.exe
