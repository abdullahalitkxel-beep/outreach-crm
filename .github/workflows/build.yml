name: Build desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test from source
        run: python tests/smoke_test.py app.py

      - name: Build OutreachCRM.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name OutreachCRM
          --icon assets/icon.ico
          --add-data "config.yaml;."
          --add-data ".env.example;."
          --hidden-import apollo
          --hidden-import bs4
          --hidden-import openpyxl
          --collect-submodules anthropic
          --collect-data tzdata
          app.py

      - name: Test the built .exe
        run: python tests/smoke_test.py dist/OutreachCRM.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OutreachCRM-windows
          path: dist/OutreachCRM.exe

      - name: Publish release (only after every test passed)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Outreach CRM 1.0.${{ github.run_number }} (Windows)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **OutreachCRM.exe** below and double-click it.
            First time: if Windows shows "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed).
            Your data stays in %APPDATA%\OutreachCRM, so replacing the .exe with a newer version keeps everything.
          files: dist/OutreachCRM.exe
