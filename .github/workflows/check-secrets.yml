name: Check release secrets

# Run this by hand (Actions → Check release secrets → Run workflow) after changing any secret.
# It takes under a minute and names any secret that is wrong. The full build runs the same check first.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release secrets
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          python -m pip install --quiet cryptography
          python packaging/check_secrets.py
